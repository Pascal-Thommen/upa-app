server {
    listen 80;
    server_name _;
    client_max_body_size 15M;

    root /usr/share/nginx/html;
    index index.html;

    # Keep relative redirects to preserve external ports (e.g. NetBird, port mappings)
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/manifest+json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Health check for frontend container
    location = /frontend-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # UPA Campus PWA (landing de escritorio con QR + aplicacion movil)
    location = / {
        try_files /campus/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Service Worker de la PWA Campus (sin cache para recibir actualizaciones inmediatas)
    location = /sw.js {
        try_files /campus/sw.js =404;
        default_type application/javascript;
        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Manifiesto de aplicacion web (PWA / TWA)
    location = /manifest.webmanifest {
        try_files /campus/manifest.webmanifest =404;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Digital Asset Links para Trusted Web Activity (Android)
    location = /.well-known/assetlinks.json {
        try_files /campus/.well-known/assetlinks.json =404;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Archivos estaticos de la PWA Campus
    location ^~ /campus/ {
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # Redirect bare /dashboard to /dashboard/publicaciones
    location = /dashboard {
        return 302 /dashboard/publicaciones;
    }

    # Media uploads proxy to backend
    location ^~ /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # API endpoints proxy to backend
    location ^~ /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Static assets (images, CSS, JS, fonts) with efficient 24h public cache
    location ~* ^(?:/dashboard)?/(.+\.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot))$ {
        rewrite ^(?:/dashboard)?/(.+)$ /$1 break;
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # Explicit no-cache for index.html (including internal redirects from try_files)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Web-Admin Portal SPA subroutes and HTML fallback
    location /dashboard/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Health endpoint proxy to backend
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # OpenAPI and Swagger documentation proxy to backend
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
