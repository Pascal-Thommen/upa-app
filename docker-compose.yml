services:
  postgres:
    image: postgres:16-alpine
    container_name: upa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: upa_app
      POSTGRES_USER: upa_user
      POSTGRES_PASSWORD: upa_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upa_user -d upa_app"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - upa-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: upa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: production
      PORT: 8000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://upa_user:upa_password@postgres:5432/upa_app
      ALLOWED_EMAIL_DOMAIN: upa.edu.py
    ports:
      - "8000:8000"
    volumes:
      - ./backend/secrets:/app/secrets:ro
    networks:
      - upa-network

networks:
  upa-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
