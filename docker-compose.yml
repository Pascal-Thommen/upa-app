services:
  postgres:
    image: postgres:16-alpine
    container_name: upa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: upa_app
      POSTGRES_USER: upa_user
      POSTGRES_PASSWORD: upa_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upa_user -d upa_app"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - upa-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: upa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: /home/pasc/.config/upa-app/.env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: production
      PORT: 8000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://upa_user:upa_password@postgres:5432/upa_app
      ALLOWED_EMAIL_DOMAIN: upa.edu.py
      GOOGLE_CLIENT_ID: "50361321197-om1eptt5qisjn8jeunkjs47o56il7s33.apps.googleusercontent.com"
    ports:
      - "8000:8000"
    volumes:
      - /home/pasc/.config/upa-app/secrets:/app/secrets:ro
      - uploads_data:/app/uploads
    networks:
      - upa-network

  frontend:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    container_name: upa-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8085:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/frontend-health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - upa-network

networks:
  upa-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
