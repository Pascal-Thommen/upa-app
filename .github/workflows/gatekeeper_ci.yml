name: Gatekeeper CI & Quality Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-mock-audit:
    name: 🛡️ Zero-Mock & Architecture Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Zero-Mock & Architecture Audit
        run: |
          python scripts/audit_zero_mock.py --github-summary

      - name: Run Audit Tool Self-Tests
        run: |
          pip install --upgrade pip
          pip install pytest
          pytest -v tests/test_audit_zero_mock.py

  linter:
    name: 🔍 Ruff Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          pip install --upgrade pip
          pip install "ruff>=0.8,<1"

      - name: Run Ruff Lint Across Codebase
        run: |
          ruff check .

  test-backend:
    name: 🧪 Campus Platform Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Backend
        run: |
          cd backend
          PYTHONPATH=. pytest -v tests

  docker-build:
    name: 🐳 Docker Container Build & Compose Stack Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: upa-app-backend:ci-test
          load: true

      - name: Verify Docker Compose Stack & Database Persistence
        run: |
          # Start stack in detached mode
          docker compose up -d

          # Wait for backend container to become healthy (max 60 seconds)
          echo "Waiting for services to become healthy..."
          for i in $(seq 1 30); do
            HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' upa-app-backend 2>/dev/null || echo "starting")
            if [ "$HEALTH" = "\"healthy\"" ]; then
              echo "Backend container is healthy!"
              break
            fi
            echo "Waiting ($i/30)... Current health: $HEALTH"
            sleep 2
          done

          # Check container statuses
          docker compose ps

          # Verify HTTP health and readiness endpoints
          curl --fail http://127.0.0.1:8000/health
          echo ""
          curl --fail http://127.0.0.1:8000/ready
          echo ""

          # Run Alembic database migrations against PostgreSQL
          docker compose exec -T backend alembic upgrade head

          # Verify PostgreSQL schema tables and foreign key constraint
          docker compose exec -T postgres psql -U upa_user -d upa_db -c "\dt"
          FK_CHECK=$(docker compose exec -T postgres psql -U upa_user -d upa_db -t -c "SELECT conname FROM pg_constraint WHERE conrelid = 'news'::regclass AND contype = 'f';" | xargs)
          if [ -z "$FK_CHECK" ]; then
            echo "Alembic foreign key verification failed!"
            exit 1
          fi
          echo "Alembic migration and foreign key successfully verified: $FK_CHECK"

          # Test PostgreSQL Persistence: write data, restart container, verify data
          docker compose exec -T postgres psql -U upa_user -d upa_db -c "CREATE TABLE ci_persistence_test (id serial PRIMARY KEY, note text);"
          docker compose exec -T postgres psql -U upa_user -d upa_db -c "INSERT INTO ci_persistence_test (note) VALUES ('persistence_verified');"

          # Restart postgres container
          docker compose restart postgres
          sleep 5

          # Verify persisted data
          RESULT=$(docker compose exec -T postgres psql -U upa_user -d upa_db -t -c "SELECT note FROM ci_persistence_test WHERE id=1;" | xargs)
          if [ "$RESULT" != "persistence_verified" ]; then
            echo "Persistence verification failed! Got: '$RESULT'"
            exit 1
          fi
          echo "PostgreSQL persistence successfully verified: $RESULT"

          # Tear down stack
          docker compose down -v

  gatekeeper-gate:
    name: 🏆 Gatekeeper Quality Gate
    runs-on: ubuntu-latest
    needs: [zero-mock-audit, linter, test-backend, docker-build]
    if: always()
    steps:
      - name: Evaluate Quality Gate Results
        run: |
          echo "## 🏆 Gatekeeper CI Evaluation Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Zero-Mock & Architecture Audit | ${{ needs.zero-mock-audit.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Ruff Linter | ${{ needs.linter.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Campus Platform Tests | ${{ needs.test-backend.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build & Compose Stack | ${{ needs.docker-build.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.zero-mock-audit.result }}" != "success" ] || \
             [ "${{ needs.linter.result }}" != "success" ] || \
             [ "${{ needs.test-backend.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "> **Gatekeeper Verdict**: ⛔ **REJECTED**" >> $GITHUB_STEP_SUMMARY
            echo "> Automated verification detected failures. PR merge blocked." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "> **Gatekeeper Verdict**: 🟢 **PASSED**" >> $GITHUB_STEP_SUMMARY
            echo "> All automated tests, linters, Docker builds, and Zero-Mock audits passed. Ready for Gatekeeper review." >> $GITHUB_STEP_SUMMARY
          fi

  container-deploy:
    name: 🚀 Container Deployment to GHCR
    runs-on: ubuntu-latest
    needs: [gatekeeper-gate]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Build and Push Backend Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
