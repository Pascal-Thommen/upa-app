name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js (pruebas de PWA y Cockpit de Redaccion)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Frontend Test Dependencies
        run: |
          npm --prefix web-app/tests ci
          npm --prefix web-admin/tests ci

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.8,<1" -r backend/requirements.txt

      - name: Run Ruff Linter & Zero-Mock Audit
        run: |
          ruff check .
          python scripts/audit_zero_mock.py

      - name: Run Pytest
        run: |
          cd backend
          PYTHONPATH=. pytest -v tests/

  docker-build-and-verify:
    name: Docker Build & Verification
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.beta.yml config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: upa-app-backend:latest
